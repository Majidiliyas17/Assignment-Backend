server {
    listen 80;
    server_name api.aspslai.com;

    # Redirect HTTP -> HTTPS (needs certbot/Let's Encrypt)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.aspslai.com;

    ssl_certificate     /etc/letsencrypt/live/api.aspslai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aspslai.com/privkey.pem;

    # Increase body limit only if files ever pass through the server.
    # (Files upload directly to Cloudinary, so 1mb is fine here.)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
